<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Lab 11 - Danh sách Khóa học</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav>
        <div class="logo">Lab11 - Spring Boot</div>
        <ul class="nav-links">
            <li><a href="/">Trang Chủ</a></li>
            <li><a href="/about">Giới Thiệu</a></li>
            <li><a href="/students">Sinh Viên</a></li>
            <li><a href="/courses" class="active">Khóa Học</a></li>
            <li><a href="/contact">Liên Hệ</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>Danh Sách Khóa Học</h1>
                <span class="badge" th:text="${#lists.size(courses)} + ' Khóa Học'">5 Khóa Học</span>
            </div>

            <div class="course-grid">
                <div class="course-card" th:each="course : ${courses}">
                    <div class="course-code" th:text="${course.code}">INT3110</div>
                    <h3 class="course-name" th:text="${course.name}">Lập trình Java nâng cao</h3>
                    <div class="course-credits">
                        <span class="credits-badge" th:text="${course.credits} + ' tín chỉ'">3 tín chỉ</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 EAUT - Spring Boot & Thymeleaf Lab 11 Project</p>
    </footer>
</body>
</html>
