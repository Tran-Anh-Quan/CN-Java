<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Form</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f9f9f9; }
        .form-container { max-width: 500px; background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="email"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn { padding: 10px 15px; color: white; border: none; cursor: pointer; border-radius: 4px; font-size: 16px; }
        .btn-save { background-color: #4CAF50; }
        .btn-save:hover { background-color: #45a049; }
        .btn-cancel { background-color: #9e9e9e; text-decoration: none; display: inline-block; padding: 10px 15px; }
        .btn-cancel:hover { background-color: #777; }
        .actions { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2 th:text="${student.id != null ? 'Edit Student' : 'Add Student'}">Add Student</h2>
        <form th:action="@{/students}" th:object="${student}" method="post">
            <input type="hidden" th:field="*{id}" />
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" th:field="*{name}" required placeholder="Enter student name" />
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" th:field="*{email}" required placeholder="Enter student email" />
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-save">Save</button>
                <a th:href="@{/students}" class="btn btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
