<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student List</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f9f9f9; }
        h2 { color: #333; }
        .nav { margin-bottom: 20px; }
        .nav a { margin-right: 15px; text-decoration: none; color: #2196F3; font-weight: 600; }
        .nav a:hover { text-decoration: underline; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .search-form { display: flex; gap: 8px; }
        .search-form input[type="text"] { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: 250px; }
        .search-form button { padding: 8px 14px; background-color: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .search-form button:hover { background-color: #0b7dda; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; background-color: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        th, td { border-bottom: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f2f2f2; font-weight: 600; }
        tr:hover { background-color: #f5f5f5; }
        .btn { padding: 8px 12px; text-decoration: none; color: white; border-radius: 4px; display: inline-block; font-size: 14px; }
        .btn-add { background-color: #4CAF50; }
        .btn-add:hover { background-color: #45a049; }
        .btn-edit { background-color: #2196F3; }
        .btn-edit:hover { background-color: #0b7dda; }
        .btn-delete { background-color: #f44336; }
        .btn-delete:hover { background-color: #da190b; }
        .empty-msg { text-align: center; padding: 30px; color: #999; font-style: italic; }
    </style>
</head>
<body>
    <div class="nav">
        <a th:href="@{/students}"><b>Students</b></a>
        <a th:href="@{/courses}">Courses</a>
    </div>

    <h2>Student List</h2>

    <div class="toolbar">
        <a th:href="@{/students/new}" class="btn btn-add">+ Add Student</a>
        <form class="search-form" th:action="@{/students}" method="get">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by name..." />
            <button type="submit">Search</button>
            <a th:href="@{/students}" class="btn" style="background-color:#9e9e9e;">Clear</a>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="student : ${students}">
                <td th:text="${student.id}">1</td>
                <td th:text="${student.name}">John Doe</td>
                <td th:text="${student.email}">john@example.com</td>
                <td>
                    <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-edit">Edit</a>
                    <a th:href="@{/students/delete/{id}(id=${student.id})}" class="btn btn-delete"
                       onclick="return confirm('Are you sure you want to delete this student?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(students)}" class="empty-msg">
        No students found.
    </div>
</body>
</html>
