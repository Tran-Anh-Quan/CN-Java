<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập - Lab 16</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body.auth-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        .login-box h1 {
            text-align: center;
            margin-bottom: 6px;
            color: #333;
        }
        .login-box .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
        }
        .login-box .form-group { margin-bottom: 18px; }
        .login-box label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .login-box input:focus {
            outline: none;
            border-color: #667eea;
        }
        .login-box .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .login-box .submit-btn:hover { transform: translateY(-2px); }
        .login-box .demo-info {
            margin-top: 20px;
            padding: 14px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.85em;
        }
        .login-box .demo-info h4 { margin-bottom: 8px; }
        .login-box .demo-info p { margin: 4px 0; color: #666; }
    </style>
</head>
<body class="auth-login">
    <div class="login-box">
        <h1>🔐 Đăng Nhập</h1>
        <p class="subtitle">Hệ thống Quản Lý Đơn Hàng</p>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="submit-btn">Đăng Nhập</button>
        </form>

        <div class="demo-info">
            <h4>📋 Tài khoản demo:</h4>
            <p><strong>Manager:</strong> manager1 / password123</p>
            <p><strong>Admin:</strong> admin / password123</p>
        </div>
    </div>
</body>
</html>
