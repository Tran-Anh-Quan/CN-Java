<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details - Lab 12</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --primary: #0f766e;
            --primary-light: #14b8a6;
            --primary-dark: #0f766e;
            --bg-color: #f0fdfa;
            --surface: rgba(255, 255, 255, 0.9);
            --text-main: #134e4a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #ccfbf1 0%, #f0fdfa 100%);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(15, 118, 110, 0.08), inset 0 1px 0 rgba(255,255,255,0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.4);
        }
        
        .header {
            text-align: center;
            margin-bottom: 35px;
        }
        
        h1 {
            color: var(--primary-dark);
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .avatar {
            width: 80px;
            height: 80px;
            background: #ccfbf1;
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            margin: 0 auto 20px auto;
            box-shadow: 0 8px 16px rgba(20, 184, 166, 0.2);
        }
        
        .details-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
        }
        
        .detail-row {
            display: flex;
            padding: 18px 10px;
            border-bottom: 1px solid var(--border);
            align-items: center;
        }
        
        .detail-row:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            font-weight: 600;
            width: 140px;
            color: var(--text-muted);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .detail-value {
            flex: 1;
            font-weight: 500;
            font-size: 16px;
            color: var(--text-main);
        }
        
        .badge {
            background: #ccfbf1;
            color: var(--primary-dark);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            display: inline-block;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 35px;
        }
        
        .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 24px;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(15, 118, 110, 0.15);
        }
        
        .btn:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(20, 184, 166, 0.25);
        }
        
        .btn-outline {
            background: transparent;
            color: #64748b;
            border: 2px solid #e2e8f0;
            box-shadow: none;
        }
        
        .btn-outline:hover {
            background: #f8fafc;
            color: var(--text-main);
            border-color: #cbd5e1;
            transform: translateY(0);
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="avatar" th:text="${#strings.substring(student.name,0,1)}">S</div>
            <h1>Student Profile</h1>
        </div>
        
        <div class="details-card">
            <div class="detail-row">
                <div class="detail-label">Student ID</div>
                <div class="detail-value" th:text="${student.id}" style="font-weight: 700; color: var(--primary);"></div>
            </div>
            <div class="detail-row">
                <div class="detail-label">Full Name</div>
                <div class="detail-value" th:text="${student.name}"></div>
            </div>
            <div class="detail-row">
                <div class="detail-label">Email Address</div>
                <div class="detail-value" th:text="${student.email}"></div>
            </div>
            <div class="detail-row">
                <div class="detail-label">Major</div>
                <div class="detail-value">
                    <span class="badge" th:text="${student.major}"></span>
                </div>
            </div>
        </div>
        
        <div class="btn-group">
            <a th:href="@{/students}" class="btn btn-outline">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Back to List
            </a>
            <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                Edit Profile
            </a>
        </div>
    </div>
</body>
</html>
