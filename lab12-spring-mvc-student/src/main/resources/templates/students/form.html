<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${student.id == null ? 'Add Student' : 'Edit Student'}">Student Form</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --primary: #0f766e;
            --primary-light: #14b8a6;
            --primary-dark: #0f766e;
            --bg-color: #f0fdfa;
            --surface: rgba(255, 255, 255, 0.9);
            --text-main: #134e4a;
            --text-muted: #64748b;
            --border: #ccfbf1;
            --input-border: #cbd5e1;
            --danger: #f43f5e;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #ccfbf1 0%, #f0fdfa 100%);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 550px;
            background: var(--surface);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(15, 118, 110, 0.08), inset 0 1px 0 rgba(255,255,255,0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.4);
        }
        
        .header {
            text-align: center;
            margin-bottom: 35px;
        }
        
        h1 {
            color: var(--primary-dark);
            margin: 0 0 10px 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin: 0;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
        }
        
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--input-border);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
            background: #ffffff;
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.15);
        }
        
        input::placeholder {
            color: #94a3b8;
        }

        .is-invalid {
            border-color: var(--danger);
            box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.1);
        }
        
        .is-invalid:focus {
            border-color: #e11d48;
            box-shadow: 0 0 0 4px rgba(225, 29, 72, 0.2);
        }

        .error-msg {
            color: var(--danger);
            font-size: 13px;
            margin-top: 8px;
            font-weight: 500;
            display: flex;
            align-items: center;
        }
        
        .error-msg svg {
            margin-right: 5px;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }
        
        .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 24px;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(15, 118, 110, 0.15);
        }
        
        .btn:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(20, 184, 166, 0.25);
        }
        
        .btn-outline {
            background: transparent;
            color: #64748b;
            border: 2px solid #e2e8f0;
            box-shadow: none;
        }
        
        .btn-outline:hover {
            background: #f8fafc;
            color: var(--text-main);
            border-color: #cbd5e1;
            transform: translateY(0);
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 th:text="${student.id == null ? 'Add New Student' : 'Edit Student'}">Student Form</h1>
            <p class="subtitle">Please fill in the information below.</p>
        </div>
        
        <form th:action="@{/students/save}" th:object="${student}" method="post">
            <input type="hidden" th:field="*{id}" />
            
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" th:field="*{name}" placeholder="e.g. Nguyen Van A" autocomplete="off" 
                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" />
                <div class="error-msg" th:if="${#fields.hasErrors('name')}">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    <span th:errors="*{name}"></span>
                </div>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="text" id="email" th:field="*{email}" placeholder="e.g. student@eaut.edu.vn" autocomplete="off" 
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" />
                <div class="error-msg" th:if="${#fields.hasErrors('email')}">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    <span th:errors="*{email}"></span>
                </div>
            </div>
            
            <div class="form-group">
                <label for="major">Major</label>
                <input type="text" id="major" th:field="*{major}" placeholder="e.g. Information Technology" autocomplete="off" 
                       th:classappend="${#fields.hasErrors('major')} ? 'is-invalid' : ''" />
                <div class="error-msg" th:if="${#fields.hasErrors('major')}">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    <span th:errors="*{major}"></span>
                </div>
            </div>
            
            <div class="btn-group">
                <a th:href="@{/students}" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    Save Student
                </button>
            </div>
        </form>
    </div>
</body>
</html>
