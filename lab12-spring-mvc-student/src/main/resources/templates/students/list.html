<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management - Lab 12</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --primary: #0f766e;
            --primary-light: #14b8a6;
            --primary-dark: #0f766e;
            --bg-color: #f0fdfa;
            --surface: rgba(255, 255, 255, 0.85);
            --surface-hover: rgba(255, 255, 255, 0.95);
            --text-main: #134e4a;
            --text-muted: #64748b;
            --border: #ccfbf1;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #ccfbf1 0%, #f0fdfa 100%);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--surface);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(15, 118, 110, 0.08), inset 0 1px 0 rgba(255,255,255,0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.4);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border);
        }
        
        h1 {
            color: var(--primary-dark);
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 24px;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(15, 118, 110, 0.15);
        }
        
        .btn:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(20, 184, 166, 0.25);
        }
        
        .btn-sm {
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 8px;
        }
        
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            box-shadow: none;
        }
        
        .btn-outline:hover {
            background: rgba(15, 118, 110, 0.05);
            color: var(--primary-dark);
        }
        
        .btn-danger {
            background: #f43f5e;
            box-shadow: 0 4px 6px rgba(244, 63, 94, 0.15);
        }
        
        .btn-danger:hover {
            background: #fb7185;
            box-shadow: 0 6px 12px rgba(251, 113, 133, 0.25);
        }
        
        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.5);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 18px 24px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        
        th {
            background-color: rgba(204, 251, 241, 0.4);
            color: var(--primary-dark);
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        td {
            font-size: 15px;
            color: #334155;
        }
        
        tr:last-child td {
            border-bottom: none;
        }
        
        tr {
            transition: background-color 0.2s ease;
        }
        
        tr:hover {
            background-color: var(--surface-hover);
        }
        
        .actions {
            display: flex;
            gap: 8px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        
        .empty-state h3 {
            margin-bottom: 10px;
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Student Management</h1>
            <a th:href="@{/students/create}" class="btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Add New Student
            </a>
        </div>
        
        <div class="table-container" th:if="${not #lists.isEmpty(students)}">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Email Address</th>
                        <th>Major</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="student : ${students}">
                        <td style="font-weight: 600; color: var(--primary);" th:text="${student.id}">1</td>
                        <td th:text="${student.name}">John Doe</td>
                        <td th:text="${student.email}">john@example.com</td>
                        <td>
                            <span style="background: var(--border); padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 500; color: var(--primary-dark);" th:text="${student.major}">IT</span>
                        </td>
                        <td class="actions">
                            <a th:href="@{/students/{id}(id=${student.id})}" class="btn btn-sm btn-outline">View</a>
                            <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-sm">Edit</a>
                            <a th:href="@{/students/delete/{id}(id=${student.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this student?')">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="empty-state" th:if="${#lists.isEmpty(students)}">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--primary-light)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 20px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <h3>No students found</h3>
            <p>Get started by adding a new student to the system.</p>
        </div>
    </div>
</body>
</html>
