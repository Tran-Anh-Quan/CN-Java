<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Student List - Lab 15</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="toolbar">
            <h2>Danh sach sinh vien</h2>
            <div style="display:flex; gap:10px; align-items:center;">
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/students/new}" class="btn btn-add">+ Them sinh vien</a>
                <form class="search-form" th:action="@{/students}" method="get">
                    <input type="text" name="keyword" th:value="${keyword}" placeholder="Tim theo ten..." />
                    <button type="submit" class="btn btn-search">Tim kiem</button>
                </form>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Ho ten</th>
                    <th>Email</th>
                    <th>So mon da dang ky</th>
                    <th>Thao tac</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${student.id}">1</td>
                    <td th:text="${student.name}">John</td>
                    <td th:text="${student.email}">john@eaut.edu.vn</td>
                    <td>
                        <span class="badge-count" th:text="${#lists.size(student.enrollments)}">0</span>
                    </td>
                    <td>
                        <a th:href="@{/students/{id}/courses(id=${student.id})}" class="btn btn-view">Xem mon hoc</a>
                        <a sec:authorize="hasRole('ADMIN')" th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-edit">Sua</a>
                        <a sec:authorize="hasRole('ADMIN')" th:href="@{/students/delete/{id}(id=${student.id})}" class="btn btn-delete"
                           onclick="return confirm('Ban co chac muon xoa sinh vien nay?')">Xoa</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <div th:if="${#lists.isEmpty(students)}" class="empty-msg">
            Khong co sinh vien nao trong he thong.
        </div>

        <div sec:authorize="hasRole('USER') and !hasRole('ADMIN')" class="info-box">
            Ban dang dang nhap voi quyen <b>USER</b>. Chi co <b>ADMIN</b> moi co the them/sua/xoa.
        </div>
    </div>
</body>
</html>
