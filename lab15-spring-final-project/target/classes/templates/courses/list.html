<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Course List - Lab 15</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="toolbar">
            <h2>Danh sach mon hoc</h2>
            <div style="display:flex; gap:10px; align-items:center;">
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/courses/new}" class="btn btn-add">+ Them mon hoc</a>
                <form class="search-form" th:action="@{/courses}" method="get">
                    <input type="text" name="keyword" th:value="${keyword}" placeholder="Tim theo ten mon hoc..." />
                    <button type="submit" class="btn btn-search">Tim kiem</button>
                </form>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Ma mon hoc</th>
                    <th>Ten mon hoc</th>
                    <th>So tin chi</th>
                    <th>So SV dang ky</th>
                    <th sec:authorize="hasRole('ADMIN')">Thao tac</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="course : ${courses}">
                    <td th:text="${course.id}">1</td>
                    <td><b th:text="${course.courseCode}">CS101</b></td>
                    <td th:text="${course.courseName}">Lap trinh Java</td>
                    <td th:text="${course.credits}">3</td>
                    <td>
                        <span class="badge-count" th:text="${#lists.size(course.enrollments)}">0</span> SV
                    </td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/courses/edit/{id}(id=${course.id})}" class="btn btn-edit">Sua</a>
                        <a th:href="@{/courses/delete/{id}(id=${course.id})}" class="btn btn-delete"
                           onclick="return confirm('Ban co chac muon xoa mon hoc nay?')">Xoa</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <div th:if="${#lists.isEmpty(courses)}" class="empty-msg">
            Khong co mon hoc nao trong he thong.
        </div>
    </div>
</body>
</html>
