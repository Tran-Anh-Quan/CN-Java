<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Course Form - Lab 15</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <div class="form-card">
            <h2 th:text="${course.id != null ? 'Sua mon hoc' : 'Them mon hoc moi'}">Form</h2>
            <form th:action="@{/courses}" th:object="${course}" method="post">
                <input type="hidden" th:field="*{id}" />
                <div class="form-group">
                    <label for="courseCode">Ma mon hoc:</label>
                    <input type="text" id="courseCode" th:field="*{courseCode}" required placeholder="Vi du: CS101" />
                </div>
                <div class="form-group">
                    <label for="courseName">Ten mon hoc:</label>
                    <input type="text" id="courseName" th:field="*{courseName}" required placeholder="Vi du: Lap trinh Java" />
                </div>
                <div class="form-group">
                    <label for="credits">So tin chi:</label>
                    <input type="number" id="credits" th:field="*{credits}" required min="1" max="10" placeholder="Vi du: 3" />
                </div>
                <div class="actions">
                    <button type="submit" class="btn-save">Luu</button>
                    <a th:href="@{/courses}" class="btn-cancel">Huy</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
